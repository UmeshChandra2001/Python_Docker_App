---
services:
  db:
    container_name: db_cont
    image: umeshchandra2001/pythonapp:databaseimg
    ports:
      - "3306:3306"
    networks:
      - mypythonapp
    volumes:
      - dbvol1:/var/lib/mysql/
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          cpus: "0.5"
          memory: 1G
        limits:
          cpus: "1.0"
          memory: 1.5G

  auth_service:
    container_name: auth_cont
    image: umeshchandra2001/pythonapp:authimg
    ports:
      - "5001:5001"
    networks:
      - mypythonapp
    deploy:
      replicas: 1
      resources:
        reservations:
          cpus: "0.4"
          memory: 350M
        limits:
          cpus: "1.0"
          memory: 500M

  book_service:
    container_name: book_cont
    image: umeshchandra2001/pythonapp:bookimg
    ports:
      - "5002:5002"
    networks:
      - mypythonapp
    deploy:
      replicas: 1
      resources:
        reservations:
          cpus: "0.4"
          memory: 350M
        limits:
          cpus: "1.0"
          memory: 500M

  borrow_service:
    container_name: borrow_cont
    image: umeshchandra2001/pythonapp:borrowimg
    ports:
      - "5003:5003"
    networks:
      - mypythonapp
    depends_on:
      - db
    deploy:
      replicas: 1
      resources:
        reservations:
          cpus: "0.4"
          memory: 350M
        limits:
          cpus: "1.0"
          memory: 500M

  frontend:
    container_name: frontend_cont
    image: umeshchandra2001/pythonapp:appimg
    ports:
      - "5000:5000"
    networks:
      - mypythonapp
    depends_on:
      - db
      - auth_service
      - book_service
      - borrow_service
    deploy:
      replicas: 1
      resources:
        reservations:
          cpus: "0.6"
          memory: 800M
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  mypythonapp:
    driver: overlay

volumes:
  dbvol1:
