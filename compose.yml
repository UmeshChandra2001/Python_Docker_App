---
services:
  db:
    container_name: db_cont
    build: ./database/
    ports:
      - "3306:3306"
    networks:
      - mypythonapp
    volumes:
      - dbvol1:/var/lib/mysql/
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  auth_service:
    container_name: auth_cont
    build: ./auth/
    ports:
      - "5001:5001"
    networks:
      - mypythonapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  book_service:
    container_name: book_cont
    build: ./book/
    ports:
      - "5002:5002"
    networks:
      - mypythonapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  borrow_service:
    container_name: borrow_cont
    build: ./borrow/
    ports:
      - "5003:5003"
    networks:
      - mypythonapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  frontend:
    container_name: frontend_cont
    build: .
    ports:
      - "5000:5000"
    networks:
      - mypythonapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

networks:
  mypythonapp:
    driver: bridge

volumes:
  dbvol1:
